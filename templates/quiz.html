
{% extends "layout.html" %}

{% block title %}
Quiz
{% endblock %}

{% block main %}

<style>
    .quiz-page {
        max-width: 850px;
        margin: 0 auto;
        padding: 20px 0 50px;
    }

    .page-header {
        margin-bottom: 30px;
    }

    .page-eyebrow {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #6c757d;
        margin-bottom: 8px;
    }

    .page-header h1 {
        margin: 0;
        font-size: 2.2rem;
    }

    .page-subtitle {
        margin-top: 8px;
        color: #6c757d;
    }

    .quiz-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .quiz-question {
        background: #ffffff;
        border: 1px solid #e9ecef;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }

    .question-number {
        font-size: 0.8rem;
        font-weight: 700;
        color: #6c757d;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    .quiz-question h3 {
        margin: 0 0 20px;
        font-size: 1.1rem;
        line-height: 1.6;
    }

    .quiz-options {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .quiz-option {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border: 1px solid #dee2e6;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .quiz-option:hover {
        border-color: #adb5bd;
        background: #f8f9fa;
    }

    .quiz-option input {
        margin: 0;
        width: 17px;
        height: 17px;
        cursor: pointer;
    }

    .option-letter {
        font-weight: 700;
        min-width: 24px;
    }

    .quiz-submit {
        display: flex;
        justify-content: center;
        margin-top: 10px;
    }

    .primary-button {
        border: none;
        border-radius: 12px;
        padding: 13px 28px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        background: #212529;
        color: white;
        transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .primary-button:hover {
        transform: translateY(-2px);
        opacity: 0.9;
    }

    /* MathJax */
    mjx-container {
        margin: 0 2px;
    }

    mjx-container {
    font-size: 1.05em !important;
    }

    @media (max-width: 600px) {
        .quiz-page {
            padding: 15px 0 35px;
        }

        .page-header h1 {
            font-size: 1.8rem;
        }

        .quiz-question {
            padding: 18px;
        }
    }

</style>

<div class="quiz-page">

    <div class="page-header">
        <p class="page-eyebrow">TEST YOUR UNDERSTANDING</p>

        <h1>{{ subtopic["name"] }} Quiz</h1>

        <p class="page-subtitle">
            Choose the best answer for each question.
        </p>
    </div>

    <form method="post" class="quiz-form">

        {% for question in questions %}

            <div class="quiz-question">

                <div class="question-number">
                    Question {{ loop.index }}
                </div>

                <h3>
                    {{ question["question"] }}
                </h3>

                <div class="quiz-options">

                    <label class="quiz-option">
                        <input
                            type="radio"
                            name="question_{{ question['id'] }}"
                            value="A"
                            required
                        >

                        <span class="option-letter">A.</span>

                        <span>
                            {{ question["option_a"] }}
                        </span>
                    </label>

                    <label class="quiz-option">
                        <input
                            type="radio"
                            name="question_{{ question['id'] }}"
                            value="B"
                        >

                        <span class="option-letter">B.</span>

                        <span>
                            {{ question["option_b"] }}
                        </span>
                    </label>

                    <label class="quiz-option">
                        <input
                            type="radio"
                            name="question_{{ question['id'] }}"
                            value="C"
                        >

                        <span class="option-letter">C.</span>

                        <span>
                            {{ question["option_c"] }}
                        </span>
                    </label>

                    <label class="quiz-option">
                        <input
                            type="radio"
                            name="question_{{ question['id'] }}"
                            value="D"
                        >

                        <span class="option-letter">D.</span>

                        <span>
                            {{ question["option_d"] }}
                        </span>
                    </label>

                </div>

            </div>

        {% endfor %}

        <div class="quiz-submit">
            <button type="submit" class="primary-button">
                Submit Quiz
            </button>
        </div>

    </form>

</div>

<!-- MathJax -->
<script>
    window.MathJax = {
        tex: {
            inlineMath: [['\\(', '\\)']],
            displayMath: [['\\[', '\\]']]
        },
        svg: {
            fontCache: 'global'
        }
    };
</script>

<script
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"
    async>
</script>

{% endblock %}
