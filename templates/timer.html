
{% extends "layout.html" %}

{% block title %}
    Study Timer
{% endblock %}

{% block main %}

<style>
    .timer-page {
        max-width: 820px;
        margin: 0 auto;
        padding: 40px 0 70px;
    }

    /* Header */

    .timer-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .timer-eyebrow {
        margin: 0 0 10px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--accent);
    }

    .timer-header h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--muted);
    }

    .subtopic-title {
        margin: 10px auto 0;
        max-width: 720px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.15;
        font-weight: 750;
        color: var(--text);
        word-break: break-word;
    }

    /* Timer Card */

    .timer-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 50px 32px 38px;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
    }

    .timer-label {
        margin: 0 0 16px;
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

    #timer {
        margin: 0;
        font-size: clamp(4rem, 13vw, 7rem);
        line-height: 1;
        font-weight: 700;
        letter-spacing: 0.035em;
        font-variant-numeric: tabular-nums;
        color: var(--text);
    }

    /* Session Status */

    .timer-status-wrapper {
        display: flex;
        justify-content: center;
        margin: 22px 0 34px;
    }

    .timer-status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(99, 102, 241, 0.08);
        color: var(--accent);
        font-size: 0.82rem;
        font-weight: 650;
    }

    .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
    }

    .timer-status.paused {
        background: var(--border);
        color: var(--muted);
    }

    .timer-status.saving {
        background: rgba(99, 102, 241, 0.08);
        color: var(--accent);
    }

    /* Buttons */

    .timer-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .timer-button {
        min-width: 165px;
        min-height: 48px;
        padding: 11px 20px;
        border-radius: 10px;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 650;
        cursor: pointer;
        transition:
            transform 0.2s ease,
            opacity 0.2s ease,
            background 0.2s ease,
            border-color 0.2s ease;
    }

    .timer-button:hover:not(:disabled) {
        transform: translateY(-1px);
    }

    .timer-button:active:not(:disabled) {
        transform: translateY(0);
    }

    .timer-button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
    }

    .pause-button {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
    }

    .pause-button:hover:not(:disabled) {
        background: var(--border);
    }

    .finish-button {
        background: var(--accent);
        color: white;
        border: 1px solid var(--accent);
    }

    .finish-button:hover:not(:disabled) {
        opacity: 0.9;
    }

    .finish-button:disabled {
        cursor: default;
    }

    .finish-button.loading {
        pointer-events: none;
        opacity: 0.65;
    }

    /* Footer Note */

    .timer-note {
        margin: 28px 0 0;
        font-size: 0.78rem;
        color: var(--muted);
    }

    /* Mobile */

    @media (max-width: 600px) {

        .timer-page {
            padding: 25px 0 50px;
        }

        .timer-header {
            margin-bottom: 24px;
        }

        .timer-header h1 {
            font-size: 1rem;
        }

        .subtopic-title {
            font-size: 2rem;
        }

        .timer-card {
            padding: 38px 18px 30px;
        }

        #timer {
            font-size: clamp(3.2rem, 16vw, 5rem);
        }

        .timer-actions {
            flex-direction: column;
        }

        .timer-button {
            width: 100%;
        }
    }

    @media (prefers-reduced-motion: reduce) {

        *,
        *::before,
        *::after {
            transition-duration: 0.01ms !important;
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
        }
    }
</style>


<main class="timer-page">

    <!-- Header -->

    <header class="timer-header">

        <p class="timer-eyebrow">
            FOCUSED STUDY
        </p>

        <h1>
            Study Session
        </h1>

        <h2 class="subtopic-title">
            {{ subtopic["name"] }}
        </h2>

    </header>


    <!-- Timer -->

    <section
        class="timer-card"
        aria-labelledby="timer-heading"
    >

        <h2
            id="timer-heading"
            class="timer-label"
        >
            Session time
        </h2>


        <div
            id="timer"
            role="timer"
            aria-label="Study session duration"
        >
            00:00:00
        </div>


        <!-- Status -->

        <div class="timer-status-wrapper">

            <p
                id="timer-status"
                class="timer-status"
                aria-live="polite"
            >

                <span
                    class="status-dot"
                    aria-hidden="true"
                ></span>

                <span id="status-text">
                    Session in progress
                </span>

            </p>

        </div>


        <!-- Controls -->

        <div
            class="timer-actions"
            aria-label="Study session controls"
        >

            <button
                id="pause"
                type="button"
                class="timer-button pause-button"
                aria-label="Pause study session"
            >
                Pause
            </button>


            <button
                id="finish"
                type="button"
                class="timer-button finish-button"
                aria-label="Finish and save study session"
            >
                Finish Session
            </button>

        </div>


        <p class="timer-note">
            Your study time will be saved when you finish the session.
        </p>

    </section>

</main>


<script>

    let seconds = 0;
    let interval = null;

    const timer = document.getElementById("timer");
    const pauseButton = document.getElementById("pause");
    const finishButton = document.getElementById("finish");

    const timerStatus = document.getElementById("timer-status");
    const statusText = document.getElementById("status-text");


    function updateTimer() {

        const hours = Math.floor(seconds / 3600);

        const minutes =
            Math.floor((seconds % 3600) / 60);

        const remainingSeconds =
            seconds % 60;

        timer.textContent =
            String(hours).padStart(2, "0") + ":" +
            String(minutes).padStart(2, "0") + ":" +
            String(remainingSeconds).padStart(2, "0");
    }


    function setStatus(text, state) {

        statusText.textContent = text;

        timerStatus.classList.remove(
            "paused",
            "saving"
        );

        if (state) {
            timerStatus.classList.add(state);
        }
    }


    function startTimer() {

        if (interval !== null) {
            return;
        }

        interval = setInterval(function () {

            seconds++;
            updateTimer();

        }, 1000);

        setStatus(
            "Session in progress",
            ""
        );

        pauseButton.textContent = "Pause";

        pauseButton.setAttribute(
            "aria-label",
            "Pause study session"
        );
    }


    function pauseTimer() {

        clearInterval(interval);
        interval = null;

        pauseButton.textContent = "Resume";

        pauseButton.setAttribute(
            "aria-label",
            "Resume study session"
        );

        setStatus(
            "Session paused",
            "paused"
        );
    }


    function finishSession() {

        clearInterval(interval);
        interval = null;

        finishButton.disabled = true;
        finishButton.classList.add("loading");

        finishButton.textContent = "Saving...";

        finishButton.setAttribute(
            "aria-label",
            "Saving study session"
        );

        pauseButton.disabled = true;

        setStatus(
            "Saving your study session...",
            "saving"
        );


        fetch(
            "/timer/{{ subtopic['id'] }}/finish",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    duration: seconds
                })
            }
        )
        .then(function (response) {

            if (!response.ok) {
                throw new Error(
                    "Failed to save session"
                );
            }

            window.location.href =
                "/subtopics/{{ subtopic['topic_id'] }}";

        })
        .catch(function () {

            finishButton.disabled = false;
            finishButton.classList.remove("loading");

            finishButton.textContent =
                "Finish Session";

            finishButton.setAttribute(
                "aria-label",
                "Finish and save study session"
            );

            pauseButton.disabled = false;

            setStatus(
                "Unable to save. Please try again.",
                "paused"
            );

        });
    }


    pauseButton.addEventListener(
        "click",
        function () {

            if (interval === null) {
                startTimer();
            } else {
                pauseTimer();
            }

        }
    );


    finishButton.addEventListener(
        "click",
        finishSession
    );


    // Start automatically.

    startTimer();

</script>

{% endblock %}
