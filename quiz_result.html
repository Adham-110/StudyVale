
{% extends "layout.html" %}

{% block title %}
Quiz Result
{% endblock %}

{% block main %}

<style>
    .result-page {
        max-width: 760px;
        margin: 0 auto;
        text-align: center;
    }

    .result-header {
        margin-bottom: 28px;
    }

    .result-eyebrow {
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #6b7280;
        margin-bottom: 8px;
    }

    .result-header h1 {
        margin: 0;
        font-size: 2.2rem;
    }

    .result-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 22px;
        padding: 42px 32px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
    }

    /* SCORE RING */

    .score-ring {
        --progress: {{ percentage }}%;
        --ring-color: #22c55e;

        width: 170px;
        height: 170px;
        margin: 0 auto 28px;
        border-radius: 50%;

        background:
            conic-gradient(
                var(--ring-color) var(--progress),
                #e9ecef var(--progress)
            );

        display: flex;
        align-items: center;
        justify-content: center;

        transition: background 0.5s ease;
    }

    .score-ring::before {
        content: "";
        width: 136px;
        height: 136px;
        background: #ffffff;
        border-radius: 50%;
        position: absolute;
    }

    .score-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .score-number {
        font-size: 2.2rem;
        font-weight: 800;
        line-height: 1;
    }

    .score-label {
        margin-top: 7px;
        font-size: 0.8rem;
        color: #6b7280;
    }

    .percentage {
        font-size: 1.6rem;
        font-weight: 700;
        margin-bottom: 14px;
    }

    .result-message {
        max-width: 520px;
        margin: 0 auto 32px;
        color: #6b7280;
        line-height: 1.6;
        font-size: 1rem;
    }

    .result-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .result-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 13px 22px;
        border-radius: 12px;
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 700;
        transition: 0.2s ease;
    }

    .result-button:hover {
        transform: translateY(-1px);
    }

    .result-button.primary {
        background: #212529;
        color: #ffffff;
    }

    .result-button.secondary {
        background: #f1f3f5;
        color: #212529;
    }

    @media (max-width: 600px) {

        .result-card {
            padding: 32px 20px;
            border-radius: 18px;
        }

        .result-header h1 {
            font-size: 1.8rem;
        }

        .score-ring {
            width: 145px;
            height: 145px;
        }

        .score-ring::before {
            width: 115px;
            height: 115px;
        }

        .score-number {
            font-size: 1.9rem;
        }

        .result-actions {
            flex-direction: column;
        }

        .result-button {
            width: 100%;
        }
    }
</style>

<div class="result-page">

    <div class="result-header">
        <p class="result-eyebrow">QUIZ COMPLETE</p>
        <h1>Nice Work!</h1>
    </div>

    <div class="result-card">

        <div
            class="score-ring"
            style="
                --ring-color:
                {% if percentage >= 80 %}
                    #22c55e
                {% elif percentage >= 60 %}
                    #eab308
                {% elif percentage >= 40 %}
                    #f97316
                {% else %}
                    #ef4444
                {% endif %}
            "
        >

            <div class="score-content">

                <div class="score-number">
                    {{ score }}/{{ total }}
                </div>

                <div class="score-label">
                    Score
                </div>

            </div>

        </div>

        <div class="percentage">
            {{ percentage|round(0) }}%
        </div>

        <p class="result-message">
            {{ message }}
        </p>

        <div class="result-actions">

            <a href="/quiz/{{ subtopic_id }}" class="result-button primary">
                Try Again
            </a>

            <a href="/subtopics/{{ topic_id }}" class="result-button secondary">
                Back to Subtopics
            </a>

        </div>

    </div>

</div>

{% endblock %}
